name: Test and build Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test database operations
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m py_compile app.py store.py
      - name: Build standalone Windows EXE
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StationDesk app.py
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: StationDesk-Windows
          path: |
            dist/StationDesk.exe
            README.md
          if-no-files-found: error
