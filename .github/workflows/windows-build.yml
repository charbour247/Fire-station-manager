name: Test and build Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test database operations
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m py_compile app.py store.py scheduler.py
      - name: Check scheduling screens and drag-and-drop
        run: python tests/gui_smoke.py
      - name: Build standalone Windows EXE
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StationDesk --icon "assets/StationDesk.ico" --add-data "assets;assets" app.py
      - name: Package Windows application and desktop shortcuts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/assets -Force
          Copy-Item dist/StationDesk.exe release/
          Copy-Item README.md release/
          Copy-Item Create-Desktop-Shortcuts.ps1 release/
          Copy-Item assets/* release/assets/
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: StationDesk-Windows
          path: release/
          if-no-files-found: error
